# Example config.yaml for the Xener pipeline.
# Copy this to your working directory and edit the values.

# Required fields
cluster_key: leiden
model_species:
  - Brassica_rapa
non_model_fasta: Arabidopsis_thaliana.fasta
non_model_h5ad: ERP132245.h5ad
organ: leaf
outdir: output/ERP132245
# non_model_fasta is REQUIRED above. It becomes optional ONLY when skip_blast: true below:
#   skip_blast: true
# (no FASTA is read in that mode — the marker's gene IDs become KG keys directly)
#
# Self-annotation shortcut (see workflows/species-selection.md):
# When the target species is one of Arabidopsis_thaliana / Oryza_sativa /
# Homo_sapiens / Mus_musculus, the agent auto-sets:
#   model_species: [<that one>]
#   skip_blast: true
#   # non_model_fasta omitted
# Example for an Arabidopsis h5ad:
#   cluster_key: leiden
#   model_species:
#     - Arabidopsis_thaliana
#   non_model_h5ad: edf.h5ad
#   organ: Root
#   outdir: output/edf
#   skip_blast: true

# Optional fields (defaults shown; uncomment to override)
# marker_weight_method: prod          # prod | sum
# top_num: 30                         # Top N genes per cluster
# homolo_weight_key: pident           # pident | evalue | bitscore
# multihomolo: true                   # Keep multiple homologs per gene
# decay_factor: 0.7                   # Weight decay for graph propagation
# mode: path                          # node | path
# threshold: null                     # Z-score threshold for filtering
# skip_blast: false                   # true: skip BLAST, use marker gene IDs as KG keys directly
# candidate_annotation:               # Restrict cell types (optional)
#   - type1
#   - type2
